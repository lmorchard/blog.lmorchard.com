name: Production deploy to Amazon S3

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Pagefind
        run: |
          curl -L https://github.com/CloudCannon/pagefind/releases/download/v1.4.0/pagefind-v1.4.0-x86_64-unknown-linux-musl.tar.gz -o pagefind.tar.gz
          tar -xzf pagefind.tar.gz
          sudo mv pagefind /usr/local/bin/
          pagefind --version

      - name: Run Go tests
        run: make test

      - name: Build for production
        run: make build

      - name: Install rclone
        run: |
          curl -L https://github.com/rclone/rclone/releases/download/v1.69.3/rclone-v1.69.3-linux-amd64.zip -o rclone.zip
          unzip rclone.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone version

      - name: Configure rclone for S3
        run: |
          mkdir -p ~/.config/rclone
          echo "[s3]
          type = s3
          provider = AWS
          env_auth = true
          region = us-east-1" > ~/.config/rclone/rclone.conf

      - name: Sync files using --checksum
        run: |
          rclone sync ./build s3:${{ secrets.AWS_S3_BUCKET }} \
            --verbose \
            --checksum \
            --delete-excluded \
            --s3-acl public-read

      - name: Invalidate Cloudfront
        uses: chetan/invalidate-cloudfront-action@master
        env:
          DISTRIBUTION: ${{ secrets.DISTRIBUTION }}
          PATHS: "/*"
